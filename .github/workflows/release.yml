name: build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install desktop shell dependencies
        run: npm ci

      # The dsh backend tree must be installed per-platform: its native
      # optionalDependencies (e.g. node-addon-require-builtin-<platform>) are
      # selected by npm on the target OS. Running it inside each matrix runner
      # guarantees the packaged backend matches the artifact's platform.
      # NODE_OPTIONS raises the heap cap: dsh's dependency tree (~450 packages)
      # makes npm OOM on the default heap size.
      - name: Prepare dsh backend (per-platform)
        run: npm run prepare:backend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Build Windows artifacts
        if: matrix.os == 'windows-latest'
        run: npm run dist:win
        env:
          # electron-builder downloads a prebuilt Electron + NSIS toolchain
          # from GitHub; GH_TOKEN avoids unauthenticated rate limits.
          # No code signing is configured: artifacts are unsigned.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build macOS artifacts
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned, un-notarized build (no Apple Developer ID in this repo).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-launcher-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.dmg
            dist/*.zip
            dist/*.dmg.blockmap
          if-no-files-found: error

  # Publishes a GitHub Release with both platforms' installers attached.
  # Runs only for tag pushes (workflow_dispatch just builds and uploads
  # artifacts for manual inspection).
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dsh-launcher-windows-latest
          path: dist

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: dsh-launcher-macos-latest
          path: dist

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## 下载

          安装包见本页面 Assets，按需选择：

          - **Windows x64**：Setup（安装包）或 Portable（便携版）exe
          - **macOS arm64（Apple Silicon）**：dmg 或 zip（未签名、未公证，首次打开需「右键 → 打开」）

          DSH Launcher 是独立的社区项目，与深度求索不存在隶属、合作、授权或背书关系。
          EOF
          gh release create "${{ github.ref_name }}" \
            dist/*.exe \
            dist/*.dmg \
            dist/*.zip \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md
